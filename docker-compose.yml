version: '3.8'

services:

  mysql:
    image: mysql:8.4
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: smit
      MYSQL_DATABASE: auth_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"

  zipkin:
    image: openzipkin/zipkin:2.24
    container_name: zipkin
    ports:
      - "9411:9411"

  config-server:
    image: crazy1smit/config-server:latest
    ports:
      - "8888:8888"

  discovery-server:
    image: crazy1smit/discovery-server:latest
    ports:
      - "8761:8761"
    depends_on:
      - config-server

  auth-service:
    image: crazy1smit/auth-service:latest
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/auth_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: smit
    depends_on:
      - mysql
      - discovery-server

  job-service:
    image: crazy1smit/job-service:latest
    ports:
      - "8082:8082"
    depends_on:
      - mysql
      - rabbitmq
      - discovery-server

  application-service:
    image: crazy1smit/application-service:latest
    ports:
      - "8083:8083"
    depends_on:
      - mysql
      - discovery-server

  admin-service:
    image: crazy1smit/admin-service:latest
    ports:
      - "8084:8084"
    depends_on:
      - redis
      - discovery-server

  notification-service:
    image: crazy1smit/notification-service:latest
    ports:
      - "8085:8085"
    depends_on:
      - rabbitmq
      - redis
      - discovery-server

  api-gateway:
    image: crazy1smit/api-gateway:latest
    ports:
      - "8080:8080"
    depends_on:
      - auth-service
      - job-service
      - application-service

volumes:
  mysql_data: