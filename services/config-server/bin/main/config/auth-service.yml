server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/auth_db
    username: root
    password: smit
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  application:
    name: auth-service

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true
    ip-address: 127.0.0.1
    hostname: localhost
security:
  jwt:
    secret: my-super-secret-jwt-key-my-super-secret-jwt-key
    expiration-ms: 86400000

